<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@800;900&amp;family=Heebo:wght@800;900&amp;display=swap');
      .logo-char {
        font-family: 'Assistant', 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-weight: 900;
        fill: #2d3748;
      }
      .logo-sub {
        font-family: 'Assistant', 'Heebo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        fill: #ea0011;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="320" rx="36" fill="#ffffff" />
  
  <!-- Row 1: מ [Speech Bubble ש] ה (RTL order: מ on right, Bubble in middle, ה on left) -->
  <g>
    <!-- מ (Right side) -->
    <text x="248" y="112" font-size="76" text-anchor="middle" class="logo-char">מ</text>

    <!-- Center Red Speech Bubble representing ש -->
    <g transform="translate(112, 46)">
      <!-- Bubble Body -->
      <rect x="0" y="0" width="96" height="66" rx="15" fill="#ea0011" />
      <!-- Tail pointing down-left -->
      <path d="M22 64 L12 80 L38 64 Z" fill="#ea0011" />
      
      <!-- 3 White lines inside the bubble -->
      <rect x="15" y="15" width="66" height="7" rx="3.5" fill="#ffffff" />
      <rect x="15" y="29" width="66" height="7" rx="3.5" fill="#ffffff" />
      <rect x="15" y="43" width="46" height="7" rx="3.5" fill="#ffffff" />
    </g>

    <!-- ה (Left side) -->
    <text x="72" y="112" font-size="76" text-anchor="middle" class="logo-char">ה</text>
  </g>

  <!-- Row 2: ש ט ר ן (RTL order: ש, ט, ר, ן from right to left) -->
  <g>
    <!-- ש -->
    <text x="246" y="208" font-size="76" text-anchor="middle" class="logo-char">ש</text>
    <!-- ט -->
    <text x="188" y="208" font-size="76" text-anchor="middle" class="logo-char">ט</text>
    <!-- ר -->
    <text x="132" y="208" font-size="76" text-anchor="middle" class="logo-char">ר</text>
    <!-- ן -->
    <text x="74" y="208" font-size="76" text-anchor="middle" class="logo-char">ן</text>
  </g>

  <!-- Row 3: Subtitle Pill "> נאומים, תוכן והנחייה <" -->
  <g transform="translate(25, 238)">
    <rect width="270" height="42" rx="10" fill="#cbd5e1" />
    <text x="135" y="27" font-size="17" text-anchor="middle" class="logo-sub">
      &gt; נאומים, תוכן והנחייה &lt;
    </text>
  </g>
</svg>
